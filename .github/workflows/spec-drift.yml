name: Weekly spec drift check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Compare live spec hash against the bundled catalog stamp
        id: drift
        run: |
          npx tsx -e "
          import { createHash } from 'node:crypto';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { decodeCatalog } from './src/catalog-format.ts';
          const live = Buffer.from(await (await fetch('https://aisa.one/openapi.yaml')).arrayBuffer());
          const liveSha = createHash('sha256').update(live).digest('hex');
          const catalog = decodeCatalog(readFileSync('catalogs/aisa-jina-v3.catalog'));
          const stamped = catalog.header.specSha256;
          const drifted = liveSha !== stamped;
          console.log('live   ', liveSha);
          console.log('stamped', stamped, '(fetched', catalog.header.specFetchedAt + ')');
          appendFileSync(process.env.GITHUB_OUTPUT, 'drifted=' + drifted + '\nlive_sha=' + liveSha + '\nstamped_sha=' + stamped + '\n');
          "
      - name: Open an issue on drift
        if: steps.drift.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "AIsa spec drift: bundled catalog is stale";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "spec-drift",
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["spec-drift"],
              body: [
                "The live `https://aisa.one/openapi.yaml` no longer matches the bundled catalog stamp.",
                "",
                "- live sha256: `${{ steps.drift.outputs.live_sha }}`",
                "- stamped sha256: `${{ steps.drift.outputs.stamped_sha }}`",
                "",
                "Rebuild with `AISA_API_KEY=... npm run build:catalog`, spot-check retrieval, and release a patch.",
              ].join("\n"),
            });
