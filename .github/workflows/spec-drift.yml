name: Weekly spec drift check

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Compare live spec hash against the bundled catalog stamp
        id: drift
        run: npx tsx scripts/check-drift.mts
      - name: Open an issue on drift
        if: steps.drift.outputs.drifted == 'true'
        uses: actions/github-script@v7
        env:
          LIVE_SHA: ${{ steps.drift.outputs.live_sha }}
          STAMPED_SHA: ${{ steps.drift.outputs.stamped_sha }}
        with:
          script: |
            const title = "AIsa spec drift: bundled catalog is stale";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "spec-drift",
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["spec-drift"],
              body: [
                "The live `https://aisa.one/openapi.yaml` no longer matches the bundled catalog stamp.",
                "",
                "- live sha256: `" + process.env.LIVE_SHA + "`",
                "- stamped sha256: `" + process.env.STAMPED_SHA + "`",
                "",
                "Rebuild with `AISA_API_KEY=... npm run build:catalog`, spot-check retrieval, and release a patch.",
              ].join("\n"),
            });
